name: Deploy Serverless App

on:
  push:
    branches:
      - develop  # Change this if using another branch

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install All Dependencies (Including Dev)
        run: npm install  # Installs all dependencies for build

      - name: Build Application
        run: npm run build  # Ensure package.json has a build script that generates dist/

      - name: Remove All Dependencies (Cleanup)
        run: rm -rf node_modules package-lock.json

      - name: Install Only Production Dependencies
        run: npm install --only=production  # Installs only required dependencies

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Change to your AWS region

      - name: Deploy to AWS using Serverless
        run: serverless deploy
