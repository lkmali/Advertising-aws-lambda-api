service: aws-lambda-project

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    MONGO_URI: ${env:MONGO_URI}
    JWT_SECRET: ${env:JWT_SECRET}

functions:
  signUp:
    handler: src/handlers/signUpHandler.signUpHandler
    events:
      - http:
          path: signup
          method: post
          cors: true

  login:
    handler: src/handlers/loginHandler.loginHandler
    events:
      - http:
          path: login
          method: post
          cors: true

plugins:
  - serverless-offline